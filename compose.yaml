name: arc-agi-3

services:
  dev:
    build:
      context: .
      args:
        KAGGLE_BASE: ${KAGGLE_BASE:-gcr.io/kaggle-gpu-images/python}
    init: true
    # Keep bind-mounted files owned by the SSH user running make.
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /kaggle/working
    ports:
      # Bind only to the SSH host loopback interface.
      # Client side: ssh LocalForward localhost:8889 localhost:8889
      - "127.0.0.1:8889:8888"
    volumes:
      - .:/kaggle/working
      - ./data:/kaggle/input:ro
      - ./.cache/model-cache:/tmp/model-cache
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/model-cache
      HF_HOME: /tmp/model-cache/huggingface
      JUPYTER_CONFIG_DIR: /tmp/model-cache/jupyter
      JUPYTER_RUNTIME_DIR: /tmp/model-cache/jupyter/runtime
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-arc-local}
      ADK_MODEL: ${ADK_MODEL:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - bash
      - -c
      - >-
        exec jupyter lab
        --ip=0.0.0.0
        --port=8888
        --no-browser
        --ServerApp.root_dir=/kaggle/working
        --ServerApp.token="$${JUPYTER_TOKEN}"
