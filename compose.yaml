name: arc-agi-3

services:
  dev:
    build:
      context: .
      args:
        KAGGLE_BASE: ${KAGGLE_BASE:-gcr.io/kaggle-gpu-images/python}
    init: true
    # Keep bind-mounted files owned by the SSH user running make.
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /kaggle/working
    ports:
      # Bind only to the SSH host loopback interface.
      # Client side: ssh LocalForward localhost:8889 localhost:8889
      - "127.0.0.1:8889:8888"
    volumes:
      - .:/kaggle/working
      - ./data:/kaggle/input:ro
      - ./.cache/model-cache:/tmp/model-cache
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/model-cache
      HF_HOME: /tmp/model-cache/huggingface
      JUPYTER_CONFIG_DIR: /tmp/model-cache/jupyter
      JUPYTER_RUNTIME_DIR: /tmp/model-cache/jupyter/runtime
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-arc-local}
      ADK_MODEL: ${ADK_MODEL:-}
      COGNITION_REPAIR_ATTEMPTS: ${COGNITION_REPAIR_ATTEMPTS:-1}
      COGNITION_MAX_RESETS: ${COGNITION_MAX_RESETS:-2}
      COGNITION_SECONDS: ${COGNITION_SECONDS:-600}
      COGNITION_LOG_DIR: ${COGNITION_LOG_DIR-outputs/cognition}
      VLM_API_BASE: ${VLM_API_BASE:-http://vlm:8080/v1}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - bash
      - -c
      - >-
        exec jupyter lab
        --ip=0.0.0.0
        --port=8888
        --no-browser
        --ServerApp.root_dir=/kaggle/working
        --ServerApp.token="$${JUPYTER_TOKEN}"
  vlm:
    profiles: [vlm]
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    init: true
    volumes:
      - ./.cache/model-cache/qwen3-vl-4b:/models:ro
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - --model
      - /models/Qwen3VL-4B-Instruct-Q4_K_M.gguf
      - --mmproj
      - /models/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf
      - --alias
      - qwen3-vl-4b-instruct
      - --jinja
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --n-gpu-layers
      - "99"
      - --ctx-size
      - "16384"
      - --parallel
      - "1"
